<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>Орбита</title>
<style>
  /* Свой шрифт в комплекте, а не системный: system-ui даёт Segoe UI на
     Windows, Roboto на Android и что-то третье на Mac — интерфейс выглядит
     по-разному у всех, и промо не совпадает с игрой. Rubik, лицензия OFL. */
  @font-face {
    font-family: 'Rubik';
    font-style: normal;
    font-weight: 300 900;
    font-display: block;
    src: url(font/rubik-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
      U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
      U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Rubik';
    font-style: normal;
    font-weight: 300 900;
    font-display: block;
    src: url(font/rubik-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }

  /* Полноэкранный канвас без прокрутки и без выделения по лонгтапу —
     это прямые требования модерации Яндекс Игр. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #070b1a;
    overscroll-behavior: none;
  }
  body {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    display: block; position: absolute; top: 0; left: 0;
    touch-action: none;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- SDK площадки подставляет build.py по цели сборки: для Яндекса /sdk.js,
     для ВК локальная копия vk-bridge. Локально файла нет — платформенный
     слой это переживает и уходит в офлайн-режим. -->
<script src="engine/vk-bridge.min.js?v=ac6c2cc3"></script>
<script src="engine/i18n.js?v=ac6c2cc3"></script>
<script src="engine/audio.js?v=ac6c2cc3"></script>
<script src="engine/core.js?v=ac6c2cc3"></script>
<script src="engine/analytics.js?v=ac6c2cc3"></script>
<script src="engine/platform.js?v=ac6c2cc3"></script>
<script src="game.js?v=ac6c2cc3"></script>
</body>
</html>
